<section class="page-section opera-section">
  <div class="opera-wrap container">

    <a href="#" id="back-link" class="back-link">← Serie</a>

    <div class="opera-grid">
      <div class="opera-img-wrap">
        <img id="opera-img" src="" alt="" decoding="async" fetchpriority="high">
        <button class="opera-nav prev" id="prev-img" aria-label="Precedente">‹</button>
        <button class="opera-nav next" id="next-img" aria-label="Successiva">›</button>
        <span class="opera-counter" id="opera-counter"></span>
      </div>

        <p class="label" id="opera-year">—</p>
        <h1 id="opera-title">—</h1>

      </div>

<script src="/js/main.js"></script>
<script src="/js/consent.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const serieId = params.get('serie');
  const operaId = params.get('id');
  if (!serieId || !operaId) { location.href = 'portfolio.html'; return; }

  const data = await (await fetch('data/series.json?v=1778621256')).json();
  const serie = data.series.find(s => s.id === serieId);
  if (!serie) { location.href = 'portfolio.html'; return; }
  const opera = serie.works.find(w => w.id === operaId);
  if (!opera) { location.href = 'serie.html?id=' + serieId; return; }

  document.title = opera.title + ' – Paola Maccioni';
  document.getElementById('back-link').href = 'serie.html?id=' + serie.id;
  document.getElementById('back-link').textContent = '← ' + serie.name;
  document.getElementById('opera-year').textContent = opera.year || '';
  document.getElementById('opera-title').textContent = opera.title;
  document.getElementById('opera-desc').textContent = opera.description || '';
  document.getElementById('opera-serie').textContent = 'Dalla serie ' + serie.name;

  // Gallery handling
  const gallery = opera.gallery && opera.gallery.length ? opera.gallery : [opera.image];
  const thumbs = opera.thumb_gallery && opera.thumb_gallery.length ? opera.thumb_gallery : gallery;
  let current = 0;
  const mainImg = document.getElementById('opera-img');
  const counter = document.getElementById('opera-counter');
  const thumbsWrap = document.getElementById('opera-thumbs');

  // Preload HD adiacenti per navigazione fluida
  function preload(i) {
    [i-1, i+1].forEach(k => {
      const idx = (k + gallery.length) % gallery.length;
      const im = new Image();
      im.src = gallery[idx];
    });
  }

  function show(i) {
    current = (i + gallery.length) % gallery.length;
    mainImg.src = gallery[current];
    mainImg.alt = opera.title + ' (' + (current+1) + ')';
    counter.textContent = (current+1) + ' / ' + gallery.length;
    [...thumbsWrap.children].forEach((t, idx) => t.classList.toggle('active', idx === current));
    preload(current);
  }

  // Render thumbs only if more than 1 image
  if (gallery.length > 1) {
    thumbsWrap.innerHTML = gallery.map((g, i) =>
      `<button class="opera-thumb" data-i="${i}"><img src="${thumbs[i]}" alt="" loading="lazy" decoding="async" loading="lazy"></button>`
    ).join('');
    thumbsWrap.querySelectorAll('.opera-thumb').forEach(t =>
      t.addEventListener('click', () => show(parseInt(t.dataset.i)))
    );
    document.getElementById('prev-img').addEventListener('click', () => show(current - 1));
    document.getElementById('next-img').addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });
  } else {
    document.getElementById('prev-img').style.display = 'none';
    document.getElementById('next-img').style.display = 'none';
    counter.style.display = 'none';
  }

  show(0);
})();
</script>
</body>
</html>

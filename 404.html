<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0d0c">
  <meta name="robots" content="noindex">
  <title>Pagina non trovata — Paola Maccioni</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    .nf-wrap { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 4rem 1.5rem; }
    .nf-wrap h1 { font-weight: 300; letter-spacing: 1px; }
    .nf-wrap p { color: var(--muted, #7a7570); max-width: 32em; }
    .nf-wrap a.nf-home { display: inline-block; margin-top: 2rem; padding: 0.8em 2em; border: 1px solid var(--border, #2a2826); text-decoration: none; letter-spacing: 2px; text-transform: uppercase; font-size: 0.75rem; }
  </style>
</head>
<body>

<section class="nf-wrap">
  <p class="label">404</p>
  <h1>Pagina non trovata</h1>
  <div class="rule"></div>
  <p>La pagina che cerchi non esiste o è stata spostata.<br>
  The page you are looking for does not exist or has been moved.</p>
  <a class="nf-home" href="/">← Torna alla home</a>
</section>

</body>
</html>

<body>

<nav>
  <div class="inner">
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    <ul>
      <li><a href="index.html">Home</a></li>

      <li><a href="commissioni.html">Commissioni</a></li>
      <li><a href="contatti.html">Contatti</a></li>
    </ul>
  </div>
</nav>

<section class="page-section serie-section">
  <div class="serie-wrap container">

    <header class="serie-header">
      <a href="portfolio.html" class="back-link">← Portfolio</a>
      <p class="label" id="serie-label">Serie</p>
      <h1 id="serie-name">—</h1>
      <div class="rule"></div>
      <p id="serie-desc" class="serie-tagline">—</p>
    </header>

    <div class="serie-works" id="serie-works"></div>

  </div>
</section>

<div class="legal-bar">© 2023 PIEMME di Paola Maccioni | C.F MCCPLA80R64B354E | infopiemmeart@gmail.com | Tutti i diritti sono riservati</div>

<script src="js/main.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { location.href = 'portfolio.html'; return; }

  const data = await (await fetch('data/series.json?v=1778621256')).json();
  const serie = data.series.find(s => s.id === id);
  if (!serie) { location.href = 'portfolio.html'; return; }

  document.title = serie.name + ' – Paola Maccioni';
  document.getElementById('serie-label').textContent = serie.year;
  document.getElementById('serie-name').textContent = serie.name;
  document.getElementById('serie-desc').textContent = serie.description;

  const wrap = document.getElementById('serie-works');
  wrap.innerHTML = serie.works.map(w => `
    <a class="work-tile" href="opera.html?serie=${serie.id}&id=${w.id}">
      <div class="work-tile-img">
        <img src="${w.thumb || w.image}" alt="${w.title}" loading="lazy">
      </div>
      <div class="work-tile-body">
        <p class="label">${w.year}</p>
        <h3>${w.title}</h3>
      </div>
    </a>
  `).join('');
})();
</script>
</body>
</html>
